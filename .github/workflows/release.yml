name: Preview Release

on:
  push:
    tags:
      - 'v*.*.*-alpha.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      basename: ${{ steps.version.outputs.basename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate source version and release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            python scripts/packaging/release_metadata.py --tag "${EVENT_REF#refs/tags/}" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/packaging/release_metadata.py --github-output "$GITHUB_OUTPUT"
          fi

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [metadata, checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      ASSET_BASENAME: ${{ needs.metadata.outputs.basename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch pinned runtime and license texts with SHA256 verification
        run: python scripts/packaging/prepare_runtime.py --output "$RUNNER_TEMP/release-inputs"
      - name: Install fixed build tools in an isolated environment
        shell: bash
        run: |
          "$RUNNER_TEMP/release-inputs/runtime/python/bin/python3" -m venv "$RUNNER_TEMP/native-build-venv"
          "$RUNNER_TEMP/native-build-venv/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r scripts/packaging/requirements-linux-build.txt
      - name: Build Linux x86_64 executable and checksum
        shell: bash
        run: |
          runtime_archive=$(python -c 'import json; print(json.load(open("scripts/packaging/runtime.json"))["filename"])')
          "$RUNNER_TEMP/native-build-venv/bin/python" -B scripts/packaging/build_linux.py \
            --tag "$RELEASE_TAG" \
            --runtime-archive "$RUNNER_TEMP/release-inputs/$runtime_archive" \
            --runtime-licenses "$RUNNER_TEMP/release-inputs/licenses" \
            --work "$RUNNER_TEMP/native-build-work" --output release-assets
      - name: Verify archive and execute unpacked CLI
        run: python scripts/packaging/smoke_linux.py --tag "$RELEASE_TAG" --assets release-assets --unpack "$RUNNER_TEMP/native-unpacked"
      - name: Save verified native assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/${{ env.ASSET_BASENAME }}.tar.gz
            release-assets/${{ env.ASSET_BASENAME }}.sha256
          if-no-files-found: error
          retention-days: 7

  baseline-smoke:
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container: ubuntu:20.04
    env:
      ASSET_BASENAME: ${{ needs.metadata.outputs.basename }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: /tmp/native-assets
      - name: Run the bundle on the glibc 2.31 baseline without installing Python
        shell: bash
        run: |
          cd /tmp/native-assets
          sha256sum -c "$ASSET_BASENAME.sha256"
          tar -xzf "$ASSET_BASENAME.tar.gz"
          test "$(env -u PYTHONPATH -u PYTHONHOME "./$ASSET_BASENAME/l4d2" --version)" = "l4d2-server-cli $PACKAGE_VERSION"
          "./$ASSET_BASENAME/l4d2" server configure --help
          "./$ASSET_BASENAME/l4d2" auth login --help

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [metadata, build, baseline-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: release-assets
      - name: Recheck native archive against the tagged source
        run: python scripts/packaging/check_linux.py "release-assets/l4d2-server-cli-$RELEASE_TAG-linux-x86_64.tar.gz"
      - name: Publish verified preview assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/packaging/publish_preview.py --tag "$RELEASE_TAG" --assets release-assets
