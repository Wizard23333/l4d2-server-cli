name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runner Node runtime
        run: node --version && npm --version
      - name: Rebuild the shipped panel from its lockfile
        working-directory: web/frontend
        run: npm ci && npm run build
      - name: Require committed panel assets to match source
        run: |
          git diff --exit-code -- src/l4d2_cli/web/static
          test -z "$(git ls-files --others --exclude-standard src/l4d2_cli/web/static)"

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.12'
          - os: windows-2022
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regressions (no Steam account or server mutation)
        run: python -B -m unittest discover -s tests -v
      - name: Compile the friends access plugin with verified official SourceMod SDK
        if: matrix.os == 'windows-2022' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $sdkArchive = Join-Path $env:RUNNER_TEMP 'sourcemod-sdk.zip'
          $sdkFolder = Join-Path $env:RUNNER_TEMP 'sourcemod-sdk'
          Invoke-WebRequest 'https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7257-windows.zip' -OutFile $sdkArchive
          if ((Get-FileHash $sdkArchive -Algorithm SHA256).Hash -ne '0EA889F76AA62228B100E4FB86A88A92189E4D94740D485DFD8748782F6E0BC3') { throw 'SourceMod SDK checksum mismatch' }
          Expand-Archive -LiteralPath $sdkArchive -DestinationPath $sdkFolder
          $compiler = Join-Path $sdkFolder 'addons/sourcemod/scripting/spcomp64.exe'
          $includes = Join-Path $sdkFolder 'addons/sourcemod/scripting/include'
          $compiled = Join-Path $env:RUNNER_TEMP 'l4d2_cli_access.smx'
          & $compiler src/l4d2_cli/ops/assets/l4d2_cli_access.sp -i $includes -o $compiled
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $compiled)) { throw 'Access plugin compilation failed' }
      - name: Public source checks
        run: python -B scripts/check_release.py

  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build validation tools
        run: python -m pip install build twine
      - name: Build source and wheel
        run: python -m build
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Check public source and distribution contents
        shell: bash
        run: |
          python scripts/check_release.py --artifact dist/*.whl --artifact dist/*.tar.gz
          python -m venv /tmp/l4d2-wheel-check
          /tmp/l4d2-wheel-check/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/l4d2-wheel-check/bin/l4d2 --version
          /tmp/l4d2-wheel-check/bin/l4d2 setup --help
          /tmp/l4d2-wheel-check/bin/l4d2 server configure --help
          /tmp/l4d2-wheel-check/bin/l4d2 skill show --json
          mkdir /tmp/l4d2-skill-project
          /tmp/l4d2-wheel-check/bin/l4d2 skill install --agent codex --project /tmp/l4d2-skill-project --yes --json
          /tmp/l4d2-wheel-check/bin/l4d2 skill status --agent codex --project /tmp/l4d2-skill-project --json
          /tmp/l4d2-wheel-check/bin/l4d2 skill uninstall --agent codex --project /tmp/l4d2-skill-project --yes --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          retention-days: 7
